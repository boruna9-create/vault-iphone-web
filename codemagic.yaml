workflows:
  vault-ios:
    name: Vault iOS Device Package
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          cd ios
          brew install xcodegen || true
          xcodegen generate
      - name: Build unsigned Vault for iPhone
        script: |
          cd ios
          rm -rf build Payload Vault-unsigned.ipa
          xcodebuild \
            -project Vault.xcodeproj \
            -scheme Vault \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Vault-unsigned.ipa Payload
    artifacts:
      - ios/Vault-unsigned.ipa
