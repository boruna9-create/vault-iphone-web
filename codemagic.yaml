workflows:
  vault-ios:
    name: Vault iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          cd ios
          brew install xcodegen || true
          xcodegen generate
      - name: Build Vault for iOS Simulator
        script: |
          cd ios
          xcodebuild -project Vault.xcodeproj -scheme Vault -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - ios/build/**
