<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault</title><style>body{margin:0;background:#070a10;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:50px auto;padding:20px}h1{font-size:38px;margin:0}.sub{color:#9caac2}.box{background:#111722;border:1px solid #293143;border-radius:22px;padding:18px;display:flex;gap:10px;margin:28px 0 12px}input{flex:1;background:#070b12;border:1px solid #333d50;color:#fff;padding:15px;border-radius:14px;font-size:16px}button{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer}.status{min-height:24px;color:#9db4d6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#111722;border:1px solid #293143;border-radius:20px;overflow:hidden}.card video{width:100%;aspect-ratio:9/16;background:#222;display:block}.meta{padding:12px}.name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:8px;margin-top:10px}.actions button{padding:9px 12px}.del{color:#ff6577;background:#252b38}@media(max-width:600px){.wrap{margin-top:20px}.box{flex-direction:column}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Vault</h1><p class="sub">Your private offline video library.</p><div class="box"><input id="url" placeholder="Paste an authorized media link"><button id="download">Download</button></div><div class="status" id="status"></div><h2>My Vault</h2><div class="grid" id="grid"></div></main><script>
const dbp=new Promise((resolve,reject)=>{const r=indexedDB.open('vault-db',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function all(){const db=await dbp;return new Promise((res,rej)=>{const r=db.transaction('videos').objectStore('videos').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function put(v){const db=await dbp;return new Promise((res,rej)=>{const r=db.transaction('videos','readwrite').objectStore('videos').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function del(id){const db=await dbp;return new Promise((res,rej)=>{const r=db.transaction('videos','readwrite').objectStore('videos').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function render(){const g=document.querySelector('#grid');g.innerHTML='';for(const v of (await all()).reverse()){if(!v.blob||!v.blob.size)continue;const card=document.createElement('div');card.className='card';const src=URL.createObjectURL(v.blob);card.innerHTML=`<video controls playsinline src="${src}"></video><div class="meta"><div class="name">${v.name}</div><div class="actions"><button class="save">Save to Device</button><button class="share">Share</button><button class="del">Delete</button></div></div>`;card.querySelector('.save').onclick=()=>saveFile(v);card.querySelector('.share').onclick=()=>shareFile(v);card.querySelector('.del').onclick=async()=>{await del(v.id);render()};g.appendChild(card)}}
async function shareFile(v){const f=new File([v.blob],v.name,{type:v.blob.type||'video/mp4'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:v.name});else saveFile(v)}
function saveFile(v){const a=document.createElement('a');a.href=URL.createObjectURL(v.blob);a.download=v.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
document.querySelector('#download').onclick=async()=>{const input=document.querySelector('#url').value.trim(),s=document.querySelector('#status'),b=document.querySelector('#download');if(!input)return;s.textContent='Preparing video…';b.disabled=true;try{const r=await fetch('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:input})});if(!r.ok){let e;try{e=await r.json()}catch{}throw new Error(e?.error||`Download failed (${r.status})`)}const blob=await r.blob();if(!blob.size)throw new Error('Empty video');const name=decodeURIComponent((r.headers.get('x-vault-filename')||`Vault-${Date.now()}.mp4`).replace(/[^a-zA-Z0-9._ -]/g,'_'));await put({id:crypto.randomUUID(),name,blob,created:Date.now()});s.textContent='Saved in Vault.';document.querySelector('#url').value='';await render()}catch(e){s.textContent='Could not download: '+e.message}finally{b.disabled=false}};render();
</script></body></html>
